name: Angular CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'Angular_DotNet/ClientApp/**'
      - '.github/workflows/angular-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Angular_DotNet/ClientApp/**'

env:
  NODE_VERSION: '20.x'
  WORKING_DIRECTORY: './Angular_DotNet/ClientApp'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Lint code
        run: npm run lint --if-present
        working-directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true

      - name: Run tests with coverage
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless --code-coverage
        working-directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true

      - name: Build production
        run: npm run build -- --configuration=production
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angular-coverage
          path: ${{ env.WORKING_DIRECTORY }}/coverage
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}/dist
          retention-days: 7

  security-scan:
    name: Security Scan (SonarCloud)
    runs-on: ubuntu-latest
    needs: build
    # Only run if SONAR_TOKEN is configured
    if: ${{ secrets.SONAR_TOKEN != '' }}
    
    steps:
      - name: Check SonarCloud Token
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "SONAR_TOKEN is not configured. Skipping SonarCloud scan."
            exit 0
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ env.WORKING_DIRECTORY }}
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_hackaton-poc-group4-angular
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/*.spec.ts,**/dist/**
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Run npm audit
        run: npm audit --audit-level=high
        working-directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true

      - name: Check for outdated packages
        run: npm outdated || true
        working-directory: ${{ env.WORKING_DIRECTORY }}

  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-dist-${{ github.sha }}
          path: ${{ env.WORKING_DIRECTORY }}/dist

      - name: Install serve
        run: npm install -g serve

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ${{ env.WORKING_DIRECTORY }}/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
